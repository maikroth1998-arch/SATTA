server.port=${PORT:3000}

spring.application.name=service-agreement-backend
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.sql.init.mode=always

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/service_agreements}
spring.datasource.username=${POSTGRES_USERNAME:service_agreements}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

app.export-token=${EXPORT_TOKEN:}

collaboration.base-url=https://masterdata-api-prod.grouphive.de
collaboration.products-path=/elements/aa0000000000000000000010/query
collaboration.limit=${COLLABORATION_LIMIT:20}
collaboration.is-inactive=${COLLABORATION_IS_INACTIVE:false}
collaboration.element-category-id=${COLLABORATION_ELEMENT_CATEGORY_ID:}
# Leave empty for one broad request. Set comma-separated filters like A,B,C,0,1,2 after testing API performance.
collaboration.quick-filters=${COLLABORATION_QUICK_FILTERS:camso}

collaboration.oauth.token-url=${COLLABORATION_OAUTH_TOKEN_URL:}
collaboration.oauth.client-id=${COLLABORATION_OAUTH_CLIENT_ID:}
collaboration.oauth.client-secret=${COLLABORATION_OAUTH_CLIENT_SECRET:}
collaboration.oauth.scope=${COLLABORATION_OAUTH_SCOPE:}
collaboration.oauth.grant-type=client_credentials
